<section class="testimonials-section">
  <div class="container">
    <div class="text-center">
      <h2 class="title">What Our Parents Say</h2>
      <div class="divider"></div>
      <p class="subtitle">
        Hear from our community of parents about their children's experiences at
        Woodhome Preschool Center.
      </p>
    </div>

    <div class="reviews-grid">
      <figure class="featured-card">
        <svg class="featured-quote" aria-hidden="true" viewBox="0 0 32 32" fill="currentColor">
          <path d="M9.3 6C4.9 8.6 2 12.6 2 17.6 2 22.4 4.9 26 8.8 26c3.1 0 5.5-2.4 5.5-5.4 0-3-2.2-5.2-5-5.2-.5 0-1.2.1-1.3.1.4-3 3.1-6.3 5.9-8L9.3 6zm15.4 0c-4.4 2.6-7.3 6.6-7.3 11.6 0 4.8 2.9 8.4 6.8 8.4 3.1 0 5.5-2.4 5.5-5.4 0-3-2.2-5.2-5-5.2-.5 0-1.2.1-1.3.1.4-3 3.1-6.3 5.9-8L24.7 6z" />
        </svg>

        <div class="stars" role="img" aria-label="5 out of 5 stars">
          @for (star of stars; track $index) {
            <svg class="star" aria-hidden="true" viewBox="0 0 20 20" fill="currentColor">
              <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
            </svg>
          }
        </div>

        <blockquote class="featured-text">{{ featured.text }}</blockquote>

        <figcaption class="author">
          <span class="avatar avatar-featured" aria-hidden="true">{{ featured.initials }}</span>
          <span class="author-info">
            <span class="name">{{ featured.name }}</span>
            <span class="role">{{ featured.role }}</span>
          </span>
        </figcaption>
      </figure>

      <div class="review-stack">
        @for (review of testimonials; track review.name) {
          <figure [class]="'review-card accent-' + review.color">
            <blockquote class="review-text">{{ review.text }}</blockquote>

            <figcaption class="review-footer">
              <span class="author">
                <span class="avatar" aria-hidden="true">{{ review.initials }}</span>
                <span class="author-info">
                  <span class="name">{{ review.name }}</span>
                  <span class="role">{{ review.role }}</span>
                </span>
              </span>

              <span class="stars" role="img" aria-label="5 out of 5 stars">
                @for (star of stars; track $index) {
                  <svg class="star" aria-hidden="true" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                  </svg>
                }
              </span>
            </figcaption>
          </figure>
        }
      </div>
    </div>
  </div>
</section>
